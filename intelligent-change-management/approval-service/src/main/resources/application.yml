spring:
  application:
    name: approval-service
  datasource:
    url: jdbc:mysql://localhost:3306/icm
    username: root
    password: Prtk_14rnk
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: approvalDecisionEvent:com.telecom.approval_service.kafka.event.ApprovalDecisionEvent
    consumer:
      group-id: approval-group-v2
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.telecom.approval_service.kafka.event.CrRiskConfirmedEvent

server:
  port: 9005

jwt:
  secret: mySecretKey1234567890123456789012345678901234567890
  expiration: 86400000

app:
  kafka:
    cr-risk-confirmed-topic: cr.risk_confirmed
    approval-decision-topic: approval-events
